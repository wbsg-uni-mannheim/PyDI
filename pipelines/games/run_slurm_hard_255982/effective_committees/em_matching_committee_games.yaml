seed: 42
preprocess_text: normalize_text
members:
- name: ditto_plm
  description: "Ditto PLM matcher (learned, missing-value tolerant). R2 checkpoint\
    \ at usecases_synthetic/cache/ditto_checkpoints/games/best \u2014 winner: lr=1e-5\
    \ weighted, test F1=0.9388 (3 pairs)."
  matcher:
    class: DittoMatcher
    module: usecases_synthetic.lib.ditto_matcher
    params:
      checkpoint_path: pipelines/games/checkpoints/em_matching/ditto/variant_hard/best
      fields:
      - name
      - releaseYear
      - developer
      - platform
      - genres
      - series
      - criticScore
      - userScore
      - ESRB
      - publisher
      - globalSales
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: learned
  missing_value_tolerant: true
  enabled_by_default: true
- name: magellan
  description: 'Classical-ML matcher: auto-generated comparator-vector features +
    sklearn RandomForest. `training_gold_path` runner-injected per source pair.'
  matcher:
    class: MagellanMatcher
    module: usecases_synthetic.lib.magellan_em_matcher
    params:
      numeric_attributes:
      - releaseYear
      - criticScore
      - userScore
      - globalSales
      date_attributes: []
      classifier_class: sklearn.ensemble.RandomForestClassifier
      classifier_params:
        n_estimators: 100
        max_depth: 10
        random_state: 42
        n_jobs: 1
        class_weight: balanced
      preprocess: normalize_text
      seed: 42
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: learned
  missing_value_tolerant: true
  enabled_by_default: true
- name: llm_matcher
  description: "MatchGPT-style zero-shot LLM matcher. No demonstrations retrieval\
    \ \u2014 every pair scored zero-shot."
  matcher:
    class: MatchGPTMatcher
    module: usecases_synthetic.lib.matchgpt_em_matcher
    params:
      fields:
      - name
      - releaseYear
      - developer
      - platform
      - genres
      - series
      - criticScore
      - userScore
      - ESRB
      - publisher
      - globalSales
      chat_model_name: openai/gpt-5.4-mini
      temperature: 0.0
      max_tokens: 2048
      seed: 42
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: llm
  missing_value_tolerant: true
  enabled_by_default: true
- name: comem
  description: "Compound Entity Matching (ComEM). Two-stage LLM pipeline \u2014 Stage\
    \ 1 Selecting + Stage 2 Matching. Paper defaults locked."
  matcher:
    class: ComEMMatcher
    module: usecases_synthetic.lib.comem_em_matcher
    params:
      fields:
      - name
      - releaseYear
      - developer
      - platform
      - genres
      - series
      - criticScore
      - userScore
      - ESRB
      - publisher
      - globalSales
      stage1_model: openai/gpt-5.4-mini
      stage2_model: null
      stage1_set_size: 10
      skip_stage1_below: 2
      temperature: 0.0
      max_tokens_stage1: 2048
      max_tokens_stage2: 2048
      seed: 42
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: llm
  missing_value_tolerant: true
  enabled_by_default: true
required_axes:
  matching_type:
  - learned
  - llm
  missing_value_tolerant:
  - true
column_mapping:
  dbpedia:
    title: name
    launch_yr: releaseYear
    studio: developer
    system: platform
    genre: genres
    franchise: series
  metacritic:
    game_title: name
    year_published: releaseYear
    made_by: developer
    console: platform
    press_rating: criticScore
    player_rating: userScore
    age_rating: ESRB
  sales:
    prod_title: name
    launch_dt: releaseYear
    studio: developer
    dist: publisher
    hw: platform
    genre: genres
    press_score: criticScore
    comm_rating: userScore
    age_classification: ESRB
    units_sold_mm: globalSales
