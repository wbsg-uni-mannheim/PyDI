seed: 42
preprocess_text: normalize_text
members:
- name: ditto_plm
  description: "Ditto PLM matcher (learned, missing-value tolerant). Checkpoint path\
    \ is a papers placeholder at usecases_synthetic/cache/ditto_checkpoints/papers/best\
    \ \u2014 must be (re)trained for papers; the runtime loudly disables a missing\
    \ checkpoint. Do NOT point this at another domain's checkpoint."
  matcher:
    class: DittoMatcher
    module: usecases_synthetic.lib.ditto_matcher
    params:
      checkpoint_path: pipelines/papers/checkpoints/em_matching/ditto/baseline/best
      fields:
      - title
      - authors
      - journal
      - publication_year
      - type
      - volume
      - issue
      - first_page
      - last_page
      - referenced_works_count
      - cited_by_count
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: learned
  missing_value_tolerant: true
  enabled_by_default: true
- name: magellan
  description: 'Classical-ML matcher: auto-generated comparator-vector features +
    sklearn RandomForest. `training_gold_path` runner-injected per source pair. Numeric
    hints on the page-locator / count columns; `publication_year` is treated as numeric
    (bare integer year, not a date), so `date_attributes` is empty.'
  matcher:
    class: MagellanMatcher
    module: usecases_synthetic.lib.magellan_em_matcher
    params:
      attributes:
      - title
      - authors
      - journal
      - publication_year
      - type
      - volume
      - issue
      - first_page
      - last_page
      - referenced_works_count
      - cited_by_count
      numeric_attributes:
      - publication_year
      - first_page
      - last_page
      - referenced_works_count
      - cited_by_count
      date_attributes: []
      classifier_class: sklearn.ensemble.RandomForestClassifier
      classifier_params:
        n_estimators: 100
        max_depth: null
        random_state: 42
        n_jobs: 1
        class_weight: null
      preprocess: normalize_text
      seed: 42
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: learned
  missing_value_tolerant: true
  enabled_by_default: true
- name: llm_matcher
  description: "MatchGPT-style zero-shot LLM matcher. Sparse attributes (volume /\
    \ issue) render as `<missing>` where absent, acceptable for LLM prompts. No demonstrations\
    \ retrieval \u2014 every pair scored zero-shot."
  matcher:
    class: MatchGPTMatcher
    module: usecases_synthetic.lib.matchgpt_em_matcher
    params:
      fields:
      - title
      - authors
      - journal
      - publication_year
      - type
      - volume
      - issue
      - first_page
      - last_page
      - referenced_works_count
      - cited_by_count
      chat_model_name: openai/gpt-5.4-mini
      temperature: 0.0
      max_tokens: 2048
      seed: 42
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: llm
  missing_value_tolerant: true
  enabled_by_default: true
- name: comem
  description: Compound Entity Matching (ComEM). Two-stage LLM pipeline. Paper defaults
    locked.
  matcher:
    class: ComEMMatcher
    module: usecases_synthetic.lib.comem_em_matcher
    params:
      fields:
      - title
      - authors
      - journal
      - publication_year
      - type
      - volume
      - issue
      - first_page
      - last_page
      - referenced_works_count
      - cited_by_count
      stage1_model: openai/gpt-5.4-mini
      stage2_model: null
      stage1_set_size: 10
      skip_stage1_below: 2
      temperature: 0.0
      max_tokens_stage1: 2048
      max_tokens_stage2: 2048
      seed: 42
  comparators: []
  weights: []
  threshold: 0.5
  matching_type: llm
  missing_value_tolerant: true
  enabled_by_default: true
required_axes:
  matching_type:
  - learned
  - llm
  missing_value_tolerant:
  - true
column_mapping: {}
