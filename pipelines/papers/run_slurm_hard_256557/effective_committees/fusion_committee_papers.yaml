seed: 42
fused_id_column: id
gold_id_column: doi
gold_list_columns:
- authors
trust_scores:
  dblp: 1
  crossref: 3
  open_alex: 1
column_mapping: {}
evaluation_functions:
  type: tokenized_match
  title: tokenized_match
  authors: tokenized_match
  publication_year: year_only_match
  journal: tokenized_match
  keywords: tokenized_match
  volume: tokenized_match
  issue: tokenized_match
  first_page: numeric_tolerance_match
  last_page: numeric_tolerance_match
  referenced_works_count: numeric_tolerance_match
evaluation_params:
  referenced_works_count:
    tolerance: 0.1
  cited_by_count:
    tolerance: 0.1
attribute_types:
  type: categorical
  title: string
  authors: list
  publication_year: date
  journal: categorical
  keywords: string
  volume: string
  issue: string
  first_page: numeric
  last_page: numeric
  referenced_works_count: numeric
pydi_candidates:
  string:
  - name: voting
    function: voting
    module: PyDI.fusion.conflict_resolution.general
  - name: longest_string
    function: longest_string
    module: PyDI.fusion.conflict_resolution.string
  - name: shortest_string
    function: shortest_string
    module: PyDI.fusion.conflict_resolution.string
  - name: most_complete
    function: most_complete
    module: PyDI.fusion.conflict_resolution.string
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
  categorical:
  - name: voting
    function: voting
    module: PyDI.fusion.conflict_resolution.general
  - name: most_complete
    function: most_complete
    module: PyDI.fusion.conflict_resolution.string
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
  date:
  - name: voting
    function: voting
    module: PyDI.fusion.conflict_resolution.general
  - name: earliest
    function: earliest
    module: PyDI.fusion.conflict_resolution.date
  - name: most_recent
    function: most_recent
    module: PyDI.fusion.conflict_resolution.date
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
  numeric:
  - name: median
    function: median
    module: PyDI.fusion.conflict_resolution.numeric
  - name: average
    function: average
    module: PyDI.fusion.conflict_resolution.numeric
  - name: maximum
    function: maximum
    module: PyDI.fusion.conflict_resolution.numeric
  - name: minimum
    function: minimum
    module: PyDI.fusion.conflict_resolution.numeric
  - name: trimmed_mean
    function: trimmed_mean
    module: usecases_synthetic.lib.robust_aggregators
    params:
      trim: 0.1
  - name: huber_m_estimator
    function: huber_m_estimator
    module: usecases_synthetic.lib.robust_aggregators
  - name: median_of_means
    function: median_of_means
    module: usecases_synthetic.lib.robust_aggregators
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
  list:
  - name: union
    function: union
    module: PyDI.fusion.conflict_resolution.list
  - name: intersection
    function: intersection
    module: PyDI.fusion.conflict_resolution.list
  - name: intersection_k_sources
    function: intersection_k_sources
    module: PyDI.fusion.conflict_resolution.list
    params:
      k: 2
  - name: voting
    function: voting
    module: PyDI.fusion.conflict_resolution.general
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
members:
- name: pydi_per_attribute_optimal
  params: {}
- name: fusionquery_only
  params:
    max_iters: 5
    theta: 3.0e-05
    init_trust: 0.95
    history_size: 50.0
    temperature: 0.7
    threshold: 0.7
- name: truthfinder_only
  params:
    init_trust: 0.9
    gamma: 0.1
    rho: 0.5
    max_iters: 10
    early_stop: 0.001
- name: ltm_only
  params:
    alpha_0:
    - 20.0
    - 5.0
    alpha_1:
    - 10.0
    - 10.0
    beta:
    - 10.0
    - 10.0
    max_iters: 50
    burnin: 10
    thin: 2
- name: casefusion_only
  params:
    dimension: 10
    alpha: 1.05
    beta: 1.1
    lr: 0.05
    converge_rate: 1.0e-05
    max_iters: 50
- name: accusim_only
  params:
    accuracy_prior: 0.8
    n_competing_values: 10
    epsilon: 0.001
    max_iter: 20
    sim_threshold: 0.7
- name: voting_only
  params: {}
- name: prefer_higher_trust_only
  params: {}
