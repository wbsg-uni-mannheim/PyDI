pydi_candidates:
  string:
  - name: voting
    function: voting
    module: PyDI.fusion.conflict_resolution.general
  - name: longest_string
    function: longest_string
    module: PyDI.fusion.conflict_resolution.string
  - name: shortest_string
    function: shortest_string
    module: PyDI.fusion.conflict_resolution.string
  - name: most_complete
    function: most_complete
    module: PyDI.fusion.conflict_resolution.string
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
  categorical:
  - name: voting
    function: voting
    module: PyDI.fusion.conflict_resolution.general
  - name: most_complete
    function: most_complete
    module: PyDI.fusion.conflict_resolution.string
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
  numeric:
  - name: median
    function: median
    module: PyDI.fusion.conflict_resolution.numeric
  - name: average
    function: average
    module: PyDI.fusion.conflict_resolution.numeric
  - name: maximum
    function: maximum
    module: PyDI.fusion.conflict_resolution.numeric
  - name: minimum
    function: minimum
    module: PyDI.fusion.conflict_resolution.numeric
  - name: trimmed_mean
    function: trimmed_mean
    module: usecases_synthetic.lib.robust_aggregators
    params:
      trim: 0.1
  - name: huber_m_estimator
    function: huber_m_estimator
    module: usecases_synthetic.lib.robust_aggregators
  - name: median_of_means
    function: median_of_means
    module: usecases_synthetic.lib.robust_aggregators
  - name: prefer_higher_trust
    function: prefer_higher_trust
    module: PyDI.fusion.conflict_resolution.general
members:
- name: pydi_per_attribute_optimal
  params: {}
- name: fusionquery_only
  params:
    max_iters: 5
    theta: 3.0e-05
    init_trust: 0.95
    history_size: 50.0
    temperature: 0.3
    threshold: 0.5
- name: truthfinder_only
  params:
    init_trust: 0.8
    gamma: 0.1
    rho: 0.5
    max_iters: 10
    early_stop: 0.001
- name: ltm_only
  params:
    alpha_0:
    - 50.0
    - 10.0
    alpha_1:
    - 10.0
    - 10.0
    beta:
    - 10.0
    - 10.0
    max_iters: 50
    burnin: 10
    thin: 2
- name: casefusion_only
  params:
    dimension: 10
    alpha: 1.05
    beta: 1.1
    lr: 0.01
    converge_rate: 1.0e-05
    max_iters: 50
- name: accusim_only
  params:
    accuracy_prior: 0.7
    n_competing_values: 10
    epsilon: 0.001
    max_iter: 20
    sim_threshold: 0.5
- name: voting_only
  params: {}
- name: prefer_higher_trust_only
  params: {}
