# Best-of-breed pipeline config for papers.
#
# Papers sources: dblp (anchor for fusion), crossref, open_alex. IDs
# are auto-generated by PyDI.io.load_json(add_index=True) in the form
# "<source>-NNNNN" matching what the EM gold under
# input/entitymatching/ already references.
#
# Source pairs: (dblp, crossref) and (dblp, open_alex). The EM gold
# files are dblp_<other>_{train,val,test}.csv with columns
# id_dblp,id_<other>,label — the canonical_loader renames them to
# the standard id1,id2,label shape in-memory.
#
# Papers is NOT registered in usecases_synthetic's VALID_DOMAINS, so
# load_pipeline_bundle routes via pipelines/lib/canonical_loader.py
# regardless of bundle_source.
#
# Caveats (2026-06-01 inventory):
#   - SM gold is not authored for papers; the SM committee will skip
#     scoring (and downstream stages must rely on the existing column
#     names lining up across sources after the notebook's manual
#     mapping that papers_workflow_minimal.ipynb performs upstream).
#   - usecases_synthetic/config/committees/ does not ship per-domain
#     YAMLs for papers (sm_committee.yaml falls back; em + fusion
#     committees resolve to the unsuffixed companies-canonical
#     files). Author dedicated em_*_committee_papers.yaml +
#     fusion_committee_papers.yaml before a serious run.
#
# LLM members default OFF in EM matching + Fusion per the 2026-06-01
# directive; LLM stays ON in SM.

domain: papers

bundle_source: canonical

stages:
  sm:
    enabled: true
    selection_metric: f1
  norm:
    enabled: true
    selection_metric: macro_f1
    apply_winner: false
    vacuous_epsilon: 0.005
  em:
    enabled: true
    blocking_selection_metric: reduction_ratio
    matching_selection_metric: f1
    clustering: greedy
  refinement:
    enabled: true
    methods: [baseline, greedy, mbm]
    selection_metric: f1
  fusion:
    enabled: true
    selection_metric: macro_accuracy

# Column type config for the e2e panel.
# Derived from usecases/papers/input/schemamatching/target_schema.json.
column_types:
  id: identifier
  cluster_id: identifier
  doi: identifier
  type: categorical
  title: text
  authors: list  # array of author names; handled at cluster level (skip distributional)
  publication_year: temporal
  journal: text
  publisher: categorical
  keywords: text
  volume: categorical
  issue: categorical
  first_page: numerical
  last_page: numerical
  referenced_works_count: numerical
  cited_by_count: numerical

# Papers notebook uses prefer_higher_trust(trust_map) on
# referenced_works_count + last_page, voting on most others.
# numeric_tolerance_match defaults to 0.10 relative tolerance for the
# two counts.
panel_tolerance:
  default: 0.05
  overrides:
    referenced_works_count: 0.10
    cited_by_count: 0.10

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

# Source ids are auto-generated by PyDI.io.load_json(add_index=True)
# as "<source>-NNNNN" — note the dash separator.
source_prefix_map:
  dblp-: dblp
  crossref-: crossref
  open_alex-: open_alex
