# Best-of-breed pipeline config for games.
#
# Games sources: dbpedia, metacritic (anchor for fusion eval),
# sales. Two declared pairs per usecases_synthetic/config/domains/games.yaml:
# (dbpedia, sales) and (metacritic, dbpedia). The (metacritic, sales)
# pair is intentionally absent (F11 fix in plan_s1_final.md).
#
# Caveat: EM gold under usecases/games/input/entitymatching/ ships only
# {train, test} splits (no _val.csv, no _all.csv). variant_loader picks
# the _test file as the blocking gold and serves train+test to the EM
# committee — any committee/refinement stage requiring a held-out val
# surface re-thresholds against train.
#
# LLM members default OFF in EM matching + Fusion per the 2026-06-01
# directive; LLM stays ON in SM.

domain: games

bundle_source: synthetic_baseline

stages:
  sm:
    enabled: true
    selection_metric: f1
  norm:
    enabled: true
    selection_metric: macro_f1
    apply_winner: false
    vacuous_epsilon: 0.005
  em:
    enabled: true
    blocking_selection_metric: reduction_ratio
    matching_selection_metric: f1
    clustering: greedy
  refinement:
    enabled: true
    methods: [baseline, greedy, mbm]
    selection_metric: f1
  fusion:
    enabled: true
    selection_metric: macro_accuracy

# Column type config for the e2e panel.
# Derived from usecases/games/input/schemamatching/target_schema.json.
column_types:
  id: identifier
  cluster_id: identifier
  name: text
  releaseYear: temporal
  developer: text
  genres: categorical
  publisher: text
  platform: categorical
  criticScore: numerical
  userScore: numerical
  ESRB: categorical
  globalSales: numerical
  series: categorical

# Panel numerical tolerance. Games notebook uses
# numeric_tolerance_match(tolerance=2) for criticScore (0-100) and
# tolerance=0.2 for userScore (0-10). Translated to relative tolerances:
panel_tolerance:
  default: 0.05
  overrides:
    criticScore: 0.04
    userScore: 0.04
    globalSales: 0.15

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

source_prefix_map:
  dbpedia_: dbpedia
  metacritic_: metacritic
  sales_: sales
