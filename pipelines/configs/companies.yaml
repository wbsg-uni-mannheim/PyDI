# Best-of-breed pipeline config for companies.
#
# Companies sources: forbes (anchor for fusion eval), dbpedia, fullcontact.
# Source ids on forbes + dbpedia are full URIs (e.g.
# "http://www.forbes.com/companies/<slug>" and
# "http://dbpedia.org/resource/<entity>"); fullcontact ids are simple
# "fullcontact_<id>" strings.
#
# Companies has no domain-specific committee YAMLs under
# usecases_synthetic/config/committees/ — the resolver falls back to the
# unsuffixed em_blocking_committee.yaml / em_matching_committee.yaml /
# fusion_committee.yaml (companies-canonical roster).
#
# LLM members default OFF in EM matching + Fusion per the 2026-06-01
# directive; LLM stays ON in SM.

domain: companies

bundle_source: synthetic_baseline

stages:
  sm:
    enabled: true
    selection_metric: f1
  norm:
    enabled: true
    selection_metric: macro_f1
    apply_winner: false
    vacuous_epsilon: 0.005
  em:
    enabled: true
    blocking_selection_metric: reduction_ratio
    matching_selection_metric: f1
    clustering: greedy
  refinement:
    enabled: true
    methods: [baseline, greedy, mbm]
    selection_metric: f1
  fusion:
    enabled: true
    selection_metric: macro_accuracy

# Column type config for the e2e panel.
# Derived from usecases/companies/input/schemamatching/target_schema.json.
column_types:
  id: identifier
  cluster_id: identifier
  name: text
  website: identifier
  founded: temporal
  country: categorical
  city: categorical
  industry: categorical
  assets: numerical
  revenue: numerical
  founders: text

# Panel numerical tolerance. Companies notebook uses
# numeric_tolerance_match(tolerance=0.1) for revenue and assets.
panel_tolerance:
  default: 0.05
  overrides:
    assets: 0.10
    revenue: 0.10

composite_weights:
  entity_coverage: 0.10
  fact_coverage: 0.10
  source_based_fact_coverage: 0.10
  consistency: 0.10
  cluster_correctness: 0.30
  fact_correctness: 0.30

# Forbes + dbpedia ids are full URIs; fullcontact ids are short. The
# panel matches by startswith() so the long URIs are uniquely
# attributable to their source.
source_prefix_map:
  "http://www.forbes.com/": forbes
  "http://dbpedia.org/": dbpedia
  fullcontact_: fullcontact
