# Fusion committee roster — games domain.
#
# C12 schema (plan_revision.md §C12, decided 2026-05-22). Each member is
# a coherent end-to-end fusion approach producing a complete fused
# DataFrame across all attributes; per-member macro_accuracy is the
# headline metric. The per-(attribute, strategy) split of the pre-C12
# layout is retired — see baselines/games/fusion_committee_selection.json
# (written on first run) for the val-best PyDI choices each member
# locks in.
#
# Per-domain fork rather than a single canonical file because
# attribute_types + pydi_candidates depend on the schema.

seed: 42

fused_id_column: id
gold_id_column: id

# PyDI's XML loader flattens ``<genres><genre>X</genre></genres>`` to the
# column ``genres_genre``. The fusion eval + per-attribute strategies
# reference the canonical ``genres`` name; this alias bridges the
# gold-side column back to the canonical schema.
gold_column_aliases:
  genres_genre: genres

# Trust scores follow the K2 source_priority ordering for games:
# dbpedia (1) < metacritic (2) < sales (3). Sales reports global sales
# numbers from a curated dataset; metacritic's editorial release_date
# and platform are highly reliable; dbpedia is broader-coverage but
# noisier.
trust_scores:
  sales: 3
  metacritic: 2
  dbpedia: 1

# Column mapping - keep in sync with em_blocking / em_matching games
# yamls. Refreshed 2026-05-04.
column_mapping:
  dbpedia:
    title: name
    launch_yr: releaseYear
    studio: developer
    system: platform
    genre: genres
    franchise: series
  metacritic:
    game_title: name
    year_published: releaseYear
    made_by: developer
    console: platform
    press_rating: criticScore
    player_rating: userScore
    age_rating: ESRB
  sales:
    prod_title: name
    launch_dt: releaseYear
    studio: developer
    dist: publisher
    hw: platform
    genre: genres
    press_score: criticScore
    comm_rating: userScore
    age_classification: ESRB
    units_sold_mm: globalSales

# Evaluation functions per attribute. Drawn from the games fusion
# test_set.xml schema (id / name / releaseYear / developer / genres /
# publisher / platform / criticScore / userScore / ESRB).
evaluation_functions:
  name: tokenized_match
  platform: tokenized_match
  genres: tokenized_match
  developer: tokenized_match
  publisher: tokenized_match
  releaseYear: year_only_match
  criticScore: numeric_tolerance_match
  userScore: numeric_tolerance_match
  ESRB: tokenized_match

evaluation_params:
  criticScore:
    # tolerance=0.15 re-tuned 2026-05-13 on the refreshed 200-entity
    # fusion gold (validation_set_final.xml + test_set_final.xml).
    # 0.15 beats 0.10 by +0.22pp accuracy (0.7469 vs 0.7447); 0.05
    # under-performs at 0.7357.
    tolerance: 0.15
  userScore:
    tolerance: 0.15
  genres:
    # Locked at 0.1 by R5 Fusion sub-D sweep (2026-05-12): games.genres
    # lifts from 0.13 → 0.60 (best_strategy_accuracy) as threshold drops
    # 1.0 → 0.1. 0.1 is the "intersection of values" literal reading.
    threshold: 0.1

# Per-attribute semantic type. Drives member dispatch:
# string/categorical/date attributes route to a TD member's native
# method (or PyDI for cell_local members); numeric + list attributes
# route to val-best PyDI for non-native TD members.
attribute_types:
  name: string
  platform: categorical
  genres: list
  developer: string
  publisher: string
  releaseYear: date
  criticScore: numeric
  userScore: numeric
  ESRB: categorical

# PyDI candidate registry for val-selection sweeps. Used by
# pydi_per_attribute_optimal (across every attribute) and by the TD
# members on attributes whose type is not in their native set.
pydi_candidates:
  string:
    - name: voting
      function: voting
      module: PyDI.fusion.conflict_resolution.general
    - name: longest_string
      function: longest_string
      module: PyDI.fusion.conflict_resolution.string
    - name: shortest_string
      function: shortest_string
      module: PyDI.fusion.conflict_resolution.string
    - name: most_complete
      function: most_complete
      module: PyDI.fusion.conflict_resolution.string
    - name: prefer_higher_trust
      function: prefer_higher_trust
      module: PyDI.fusion.conflict_resolution.general

  categorical:
    - name: voting
      function: voting
      module: PyDI.fusion.conflict_resolution.general
    - name: most_complete
      function: most_complete
      module: PyDI.fusion.conflict_resolution.string
    - name: prefer_higher_trust
      function: prefer_higher_trust
      module: PyDI.fusion.conflict_resolution.general

  date:
    - name: voting
      function: voting
      module: PyDI.fusion.conflict_resolution.general
    - name: earliest
      function: earliest
      module: PyDI.fusion.conflict_resolution.date
    - name: most_recent
      function: most_recent
      module: PyDI.fusion.conflict_resolution.date
    - name: prefer_higher_trust
      function: prefer_higher_trust
      module: PyDI.fusion.conflict_resolution.general

  numeric:
    - name: median
      function: median
      module: PyDI.fusion.conflict_resolution.numeric
    - name: average
      function: average
      module: PyDI.fusion.conflict_resolution.numeric
    - name: maximum
      function: maximum
      module: PyDI.fusion.conflict_resolution.numeric
    - name: minimum
      function: minimum
      module: PyDI.fusion.conflict_resolution.numeric
    - name: trimmed_mean
      function: trimmed_mean
      module: usecases_synthetic.lib.robust_aggregators
      params:
        trim: 0.1
    - name: huber_m_estimator
      function: huber_m_estimator
      module: usecases_synthetic.lib.robust_aggregators
    - name: median_of_means
      function: median_of_means
      module: usecases_synthetic.lib.robust_aggregators
    - name: prefer_higher_trust
      function: prefer_higher_trust
      module: PyDI.fusion.conflict_resolution.general

  list:
    - name: union
      function: union
      module: PyDI.fusion.conflict_resolution.list
    - name: intersection
      function: intersection
      module: PyDI.fusion.conflict_resolution.list
    - name: intersection_k_sources
      function: intersection_k_sources
      module: PyDI.fusion.conflict_resolution.list
      params:
        k: 2
    - name: voting
      function: voting
      module: PyDI.fusion.conflict_resolution.general
    - name: prefer_higher_trust
      function: prefer_higher_trust
      module: PyDI.fusion.conflict_resolution.general

# C12 member roster. Each member produces a single fused DataFrame via
# one DataFusionEngine.run() call. Per-member macro_accuracy is the
# headline; best-member macro is the user-attainable ceiling per stage.
members:
  - name: pydi_per_attribute_optimal
    params: {}

  - name: llm_only
    params:
      llm_callable: openai
      llm_model: gpt-5.4-mini
      model_id: gpt-5.4-mini
      temperature: 0.0
      max_tokens: 2048
      cache_dir: usecases_synthetic/cache/llm_judge_fusion
      prompt_version: v2

  - name: fusionquery_only
    # R5 Fusion sub-H sweep on games: temperature=0.5 was used in the
    # per-attribute strategies (name / criticScore). Native on string/
    # categorical/date; val-best PyDI on numeric (criticScore, userScore)
    # + list (genres).
    params:
      max_iters: 5
      theta: 3.0e-5
      init_trust: 0.95
      history_size: 50.0
      temperature: 0.5
      threshold: 0.7

  - name: truthfinder_only
    # R5 Fusion sub-E sweep params: games.platform legacy strategy used
    # gamma=0.3. Native on string/categorical/date; val-best PyDI on
    # numeric + list.
    params:
      init_trust: 0.9
      gamma: 0.3
      rho: 0.5
      max_iters: 10
      early_stop: 1.0e-3

  - name: ltm_only
    # R5 Fusion sub-I sweep on games.genres (2026-05-12):
    # alpha_0=[30, 15] + alpha_1=[10, 10] lifts ltm own-score 0.13 → 0.27
    # vs the paper-default alpha_0=[50, 10]. Native on string/categorical/
    # date + list (multi-truth); val-best PyDI on numeric only.
    params:
      alpha_0: [30.0, 15.0]
      alpha_1: [10.0, 10.0]
      beta: [10.0, 10.0]
      max_iters: 50
      burnin: 10
      thin: 2

  - name: casefusion_only
    # R5 Fusion sub-G sweep params: games legacy name strategy used
    # alpha=1.1, beta=1.1. Native on string/categorical/date; val-best
    # PyDI on numeric + list.
    params:
      dimension: 10
      alpha: 1.1
      beta: 1.1
      lr: 0.05
      converge_rate: 1.0e-5
      max_iters: 50

  - name: accusim_only
    # Native on every attribute via the type-aware _accusim_default_sim
    # (dice on strings, Jaccard on lists, numeric-tolerance on numerics).
    params:
      accuracy_prior: 0.8
      n_competing_values: 10
      epsilon: 1.0e-3
      max_iter: 20
      sim_threshold: 0.7

  - name: voting_only
    params: {}

  - name: prefer_higher_trust_only
    params: {}
