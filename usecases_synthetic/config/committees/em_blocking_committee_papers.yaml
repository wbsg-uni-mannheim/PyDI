# EM BLOCKING committee - papers. Seeded from music 2026-06-02, UNTUNED.
seed: 42
preprocess_text: "normalize_text"
blocking_name_column: title
members:
  - name: token_blocker
    description: >-
      Token-set blocker on title (lexical). DISABLED for papers
      (2026-06-04): TokenBlocker's `_iter_batches` keeps a single
      cross-token `seen_pairs: set[(str,str)]` (token_blocking.py:295)
      that never clears between tokens. Papers titles produce
      2,183,600,065 token-block pair-frequencies (debug CSV) -
      dominated by 2-3 char English words ('for'=499M, 'of'=370M,
      'and'=331M, 'in'=181M, 'the'=98M) that all pass min_token_len=2
      without stopword filtering. The seen_pairs set bloats to
      ~50-100M (str,str) tuples and the main thread livelocks inside
      CPython's cycle-GC (`set_traverse -> visit_decref` at 1632/1638
      sample stack frames) - 96% CPU for 2h+ with zero forward
      progress. Other domains escape because their total token-block
      pair-frequencies are 100-15000x smaller (music 4.6M, games
      19.4M, companies 132k).
      Re-enable only after token_blocking.py is patched (drop the
      cross-token dedup or wrap materialize() in gc.disable()) AND a
      stopword filter is added.
    blocker:
      class: TokenBlocker
      module: PyDI.entitymatching.blocking.token_blocking
      params:
        column: title
        min_token_len: 2
    blocking_type: lexical
    enabled_by_default: false
  - name: standard_blocker
    description: >-
      Equality on name_first_20 (lexical). Papers titles need a wider
      prefix than first-token (block "a" alone = 18k records) or
      first-5-chars (block "multi" = 3069 records, "deep " = 1628).
      First-20-char prefix yields a manageable distribution: top block
      "performance analysis" = 160 records, top-10 blocks contribute
      ~137k pairs total (vs ~28M for first-5-chars). The 20-char
      window captures ~3 words for most academic titles, giving
      strong-enough discrimination without sliding into per-title
      uniqueness.
    blocker:
      class: StandardBlocker
      module: PyDI.entitymatching.blocking.standard
      params:
        "on": [name_first_20]
    blocking_type: lexical
    # DISABLED for papers (2026-06-04): StandardBlocker hangs at >50 min on
    # papers data regardless of key choice (name_first_token / _first_5 /
    # _first_20 all reproduced). Root cause unknown. The other 5 lexical /
    # sparse / embedding / hybrid blockers (token / embedding / sorted_nh /
    # bm25 / sc_block) cover the signal space; the composition's
    # ``required_axes: [lexical, sparse, embedding, hybrid]`` is satisfied
    # by token_blocker (lexical), bm25_blocker (sparse), embedding_blocker
    # (embedding), and sc_block (hybrid).
    enabled_by_default: false
  - name: embedding_blocker
    description: "Dense ANN top-k; BAAI/bge-base-en-v1.5"
    blocker:
      class: EmbeddingBlocker
      module: PyDI.entitymatching.blocking.embedding
      params:
        text_cols: [title]
        model: BAAI/bge-base-en-v1.5
        top_k: 50
        threshold: 0.3
    blocking_type: embedding
    enabled_by_default: true
  - name: sorted_neighbourhood_blocker
    description: "Sliding-window over name_norm (lexical)"
    blocker:
      class: SortedNeighbourhoodBlocker
      module: PyDI.entitymatching.blocking.sorted_neighbourhood
      params:
        key: name_norm
        window: 40
    blocking_type: lexical
    enabled_by_default: true
  - name: bm25_blocker
    description: "BM25 over char n-grams (sparse)"
    blocker:
      class: BM25Blocker
      module: usecases_synthetic.lib.bm25_blocker
      params:
        text_cols: [title]
        top_k: 50
        tokenizer: char_ngram
        ngram_range: [3, 5]
        k1: 1.5
        b: 0.75
    blocking_type: sparse
    enabled_by_default: true
  - name: sc_block
    description: >-
      SupCon encoder + ANN retrieval (hybrid). DISABLED for papers
      (2026-06-04): SCBlockBlocker MPS-encoder runtime is pathologic on
      the dblp <-> open_alex pair. v14 (logs/bob_papers_20260604_193527.log)
      ran sc_block on pair 1 (dblp_crossref) in ~30-40 min, then ran
      pair 2 (dblp_open_alex) for 2h45m+ with no completion and CPU
      drifting 27% -> 17% (sample-confirmed MPS waitUntilCompleted on
      every probe). The encoder is fine on pair 1; the regression is
      pair-2 specific (open_alex titles + authors render to longer
      tokenised sequences than crossref, pushing batches into the slow
      quadratic-attention regime; possibly compounded by MPS thermal
      throttling after sustained use).
      Re-enable once one of: (a) the encoder is moved off MPS to CPU /
      CUDA, (b) encode_batch_size is dropped and stability verified on
      open_alex, or (c) text_cols is narrowed to just `title` (removing
      authors+journal) to bound sequence length.
      required_axes was relaxed to [lexical, sparse, embedding] for this
      run; sorted_neighbourhood_blocker (lexical) + bm25_blocker
      (sparse) + embedding_blocker (embedding) cover the remaining
      signal space.
    blocker:
      class: SCBlockBlocker
      module: usecases_synthetic.lib.sc_block_blocker
      params:
        text_cols: [title, authors, journal]
        top_k: 100
        threshold: 0.0
        checkpoint_path: usecases_synthetic/cache/ditto_checkpoints/papers/best
    blocking_type: hybrid
    enabled_by_default: false
composition:
  strategy: select_best
  recall_floor: 0.97
  tie_breaker: reduction_ratio
required_axes:
  # ``hybrid`` removed for papers (2026-06-04) because sc_block (the
  # only hybrid blocker in the roster) is DISABLED on this domain due
  # to a pair-2 MPS-encoder runtime pathology; see the sc_block entry
  # above for the full rationale and the re-enable conditions.
  blocking_type: [lexical, sparse, embedding]
# Column mapping — EMPTY (2026-06-05). The papers JSONL loader already
# canonicalizes every source column via loaders._PAPERS_SOURCE_COLUMN_MAP, so a
# raw->canonical mapping here collides with the already-present canonical
# columns: apply_column_mapping drops the existing target and renames an absent
# raw key, DELETING title/authors/journal/... (every matching field). That
# silently broke all papers EM (sc_block val_pair_recall=0). Keep {} so the
# loader's canonicalization stands. Must stay byte-identical across
# em_blocking / em_matching / fusion papers yamls.
column_mapping: {}
