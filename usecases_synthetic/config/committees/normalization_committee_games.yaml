# Normalization committee roster — games domain.
#
# C12 schema (plan_revision.md §C12, decided 2026-05-22). Three coherent
# members: rule_per_attribute_optimal / llm_only / passthrough.
#
# Eligible attributes for games (SM ∩ fusion ∩ kind):
#   ESRB, criticScore, developer, genres, name, platform, releaseYear,
#   userScore.
# (publisher, series, globalSales are 1-source-only per K10 sign-off
# and dropped from K10's attribute_targets; the runner drops them here
# too because they are not in the kind map intersection.)

seed: 42

fusion_protection_tolerance: {}

rule_normalizers:
  - name: text_clean
    module: usecases_synthetic.lib.normalizer_members
    class: TextCleanNormalizer
    applies_to: [name, ESRB, developer, genres, platform]
    params:
      lowercase: false
      strip_whitespace: true
      normalize_unicode: true
      remove_html: true

  - name: date_iso
    module: usecases_synthetic.lib.normalizer_members
    class: DateIsoNormalizer
    applies_to: [releaseYear]
    params:
      date_format: '%Y-%m-%d'
      year_only_format: '%Y'
      handle_timezone: false
    # handle_timezone=false because games gold ships year-only ints; no
    # timezone projection is meaningful.

  - name: number_locale
    module: usecases_synthetic.lib.normalizer_members
    class: NumberLocaleNormalizer
    applies_to: [criticScore, userScore]
    params:
      babel_candidate_locales: [en_US]
      handle_currency: false
      handle_percentages: true

  - name: taxonomy_lookup
    module: usecases_synthetic.lib.normalizer_members
    class: TaxonomyLookupNormalizer
    applies_to: [platform, genres]
    params:
      case_insensitive: true
      taxonomies:
        games:
          platform:
            path: games/input/schemamatching/Gaming_Platforms_Taxonomy.csv
            columns: ['Platform Name']
          genres:
            path: games/input/schemamatching/Video_Game_Genres_Taxonomy.csv
            columns: ['Genre Name', 'Subgenre Name', 'Sub-Subgenre Name']
    # ESRB intentionally bound under llm_only rather than taxonomy_lookup
    # because ESRB labels in the source data carry many surface variants
    # (E10+ vs Everyone 10+ vs E10) that an exact-match lookup misses.

# LLM normalizer config (used by ``llm_only``).
llm_normalizer:
  module: usecases_synthetic.lib.llm_normalizer
  class: LLMCanonicalizer
  params:
    model_name: gpt-5.4-mini
    # num_examples=0 (zero-shot) re-tuned 2026-05-13 on the refreshed
    # 200-entity fusion gold. On the larger set 0-shot wins decisively
    # (0.5771 vs 5-shot 0.3239 mean_f1 across name / ESRB / developer /
    # genres / platform).
    num_examples: 0
    temperature: 0.0
    max_tokens: 2048
    prompt_version: v2
    cache_dir: usecases_synthetic/cache/llm_normalizer

members:
  - name: rule_per_attribute_optimal
    params: {}
  - name: llm_only
    params: {}
  - name: passthrough
    params: {}
