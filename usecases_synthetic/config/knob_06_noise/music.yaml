# Knob 06 — Value Noise Injection Rate — Music
#
# Refreshed 2026-05-07 against the schema.org-style CSV sources at
# usecases/music/input/data/. id_columns are native ``id`` on all
# three sources (no loader rename needed). New blocks: ``taxonomies``
# (Pending #4 — Music_Genres) and ``numeric_attributes`` (Pending #6).
#
# musicbrainz/lastfm have an empty ``genre`` column on the refreshed
# CSV (verified 2026-05-07); only discogs.genre is populated. K6 already
# no-ops on null cells, so the empty bindings cost nothing — they exist
# so a future refresh that backfills the column needs no config change.

domain: music

id_columns:
  musicbrainz: id
  discogs: id
  lastfm: id

attribute_classes:
  musicbrainz:
    name: primary
    artist: key
    release-country: key
    genre: key
    release-date: secondary
    duration: secondary
    label: secondary
  discogs:
    name: primary
    artist: key
    release-country: key
    genre: key
    release-date: secondary
    duration: secondary
    label: secondary
  lastfm:
    name: primary
    artist: key
    release-country: key
    genre: key
    release-date: secondary
    duration: secondary
    label: secondary

# Source column to canonical attribute (per
# config/domains/music.yaml: name / artist / release-country / genre /
# release-date / duration / label).
attribute_mapping:
  musicbrainz:
    name: name
    artist: artist
    release-country: release-country
    genre: genre
    release-date: release-date
    duration: duration
    label: label
  discogs:
    name: name
    artist: artist
    release-country: release-country
    genre: genre
    release-date: release-date
    duration: duration
    label: label
  lastfm:
    name: name
    artist: artist
    release-country: release-country
    genre: genre
    release-date: release-date
    duration: duration
    label: label

noise_rates_per_level:
  easy:
    primary: 0.0
    key: 0.0
    secondary: 0.01
  medium:
    primary: 0.0
    key: 0.02
    secondary: 0.04
  hard:
    primary: 0.01
    key: 0.06
    secondary: 0.12

transform_per_level:
  easy: compress
  medium: identity
  hard: stretch

operator_mix:
  easy:
    whitespace_corrupt: 1.0
    case_corrupt: 1.0
  medium:
    whitespace_corrupt: 1.0
    case_corrupt: 1.0
    typo_substitute: 1.5
    ocr_confuse: 1.0
    taxonomy_walk: 1.0
  hard:
    whitespace_corrupt: 0.5
    case_corrupt: 0.5
    typo_substitute: 2.0
    ocr_confuse: 1.5
    truncate: 1.0
    taxonomy_walk: 1.5

max_edits_per_cell:
  easy: 1
  medium: 1
  hard: 3

max_ocr_per_cell:
  easy: 1
  medium: 1
  hard: 2

max_truncate_chars:
  easy: 1
  medium: 2
  hard: 3

soft_global_primary_cap_hard: 0.35

compression_factor: 0.5
stretch_factor: 1.5

# Pending #4: taxonomy bindings. Music_Genres_Taxonomy is 3-level
# (Genre → Subgenre → Sub-Subgenre).
taxonomies:
  genre:
    csv: music/input/schemamatching/Music_Genres_Taxonomy.csv
    levels:
      - Genre Name
      - Subgenre Name
      - Sub-Subgenre Name
    bind:
      musicbrainz:
        genre: genre
      discogs:
        genre: genre
      lastfm:
        genre: genre

# Pending #6: ±2 % relative jitter cap. ``duration`` is in seconds (raw
# float / int) per K5 sign-off — cap applies to seconds.
numeric_jitter_max_relative: 0.02

numeric_attributes:
  musicbrainz:
    release-date: date
    duration: continuous
  discogs:
    release-date: date
    duration: continuous
  lastfm:
    release-date: date
    duration: continuous

# Easy-only cleanup rules: lastfm.name carries an "Artist - Title"
# prefix on 1365/9865 records (verified 2026-05-07). Strip the leading
# "<artist> - " segment at easy.
cleanup_rules:
  - source: lastfm
    attribute: name
    pattern: '^.+?\s+-\s+'
    replacement: ""
