noise_rates_per_level:
  easy:
    primary: 0.0
    key: 0.0
    secondary: 0.01
  medium:
    primary: 0.0
    key: 0.02
    secondary: 0.04
  hard:
    primary: 0.01
    key: 0.06
    secondary: 0.12

transform_per_level:
  easy: compress
  medium: identity
  hard: stretch

operator_mix:
  easy:
    whitespace_corrupt: 1.0
    case_corrupt: 1.0
  medium:
    whitespace_corrupt: 1.0
    case_corrupt: 1.0
    typo_substitute: 1.5
    ocr_confuse: 1.0
    taxonomy_walk: 1.0
  hard:
    whitespace_corrupt: 0.5
    case_corrupt: 0.5
    typo_substitute: 2.0
    ocr_confuse: 1.5
    truncate: 1.0
    taxonomy_walk: 1.5

max_edits_per_cell:
  easy: 1
  medium: 1
  hard: 3

max_ocr_per_cell:
  easy: 1
  medium: 1
  hard: 2

max_truncate_chars:
  easy: 1
  medium: 2
  hard: 3

soft_global_primary_cap_hard: 0.35

compression_factor: 0.5
stretch_factor: 1.5

# Pending #4: taxonomy bindings authored 2026-05-27 for the products
# cross-knob extension expansion. 3 hierarchical CSVs cover the
# categorical extensions brought into K6 scope.
taxonomies:
  storage_interface:
    csv: products/input/schemamatching/Storage_Interface_Taxonomy.csv
    levels:
    - Interface Family
    - Generation
    - Variant
    bind:
      products_1:
        bus_standard: storage_interface
        interface: storage_interface
        connector: storage_interface
      products_2:
        busType: storage_interface
        interfaceType: storage_interface
        connectionType: storage_interface
      products_3:
        Bus: storage_interface
        Interface: storage_interface
        Connector: storage_interface
      products_4:
        bus: storage_interface
        iface: storage_interface
        conn: storage_interface
  gpu_memory:
    csv: products/input/schemamatching/GPU_Memory_Taxonomy.csv
    levels:
    - Memory Family
    - Generation
    - Variant
    bind:
      products_1:
        memory_technology: gpu_memory
      products_2:
        memoryType: gpu_memory
      products_3:
        MemoryType: gpu_memory
      products_4:
        mem: gpu_memory
  product_type:
    csv: products/input/schemamatching/Product_Type_Taxonomy.csv
    levels:
    - Category
    - Subcategory
    - Type
    bind:
      products_1:
        category: product_type
      products_2:
        productCategory: product_type
      products_3:
        Type: product_type
      products_4:
        cat: product_type

# Pending #6: ±2 % relative jitter cap.
numeric_jitter_max_relative: 0.02

