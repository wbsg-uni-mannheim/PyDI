# Knob 08 — Schema Naming Divergence: Music
#
# Refreshed against the 2026-05-04 CSV sources. All three sources
# (musicbrainz, discogs, lastfm) ship with the same canonical column
# set: `id, name, artist, release-date, release-country, duration,
# label, genre, tracks` — uniformly descriptive at baseline (matches
# spec call "music @ easy"). lastfm key/secondary attributes are
# 0%-populated post-refresh per K1/K6/K10 sign-offs; K8 only renames
# headers, so empty columns cost nothing to author.

level_assignments:
  easy:
    musicbrainz: descriptive
    discogs: descriptive
    lastfm: descriptive
  medium:
    musicbrainz: abbreviated
    discogs: descriptive
    lastfm: cryptic
  hard:
    musicbrainz: cryptic
    discogs: abbreviated
    lastfm: anonymized

# Ground-truth schema mapping: source_col -> target_col.
# Canonical target names match the fusion val/test XML element tags
# and the K10 sign-off attribute_mapping. `id` columns are intentionally
# OMITTED from rename_table.
sm_mapping:
  musicbrainz:
    id: id
    name: name
    artist: artist
    release-date: release-date
    release-country: release-country
    duration: duration
    label: label
    genre: genre
    tracks: tracks
  discogs:
    id: id
    name: name
    artist: artist
    release-date: release-date
    release-country: release-country
    duration: duration
    label: label
    genre: genre
    tracks: tracks
  lastfm:
    id: id
    name: name
    artist: artist
    release-date: release-date
    release-country: release-country
    duration: duration
    label: label
    genre: genre
    tracks: tracks

