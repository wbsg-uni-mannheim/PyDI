# Knob 08 — Schema Naming Divergence: Papers
#
# Seeded from music 2026-05-04; K8 carries NO numeric rate tables
# (schema naming only renames headers), so there is nothing rate-like to
# tune here -- but per the shared papers spec this file is still a seeded,
# UNTUNED starting point and the name variants below should be reviewed
# before a real papers run.
#
# All three sources (dblp, crossref, open_alex) are already target-shaped:
# each ships the SAME 14 canonical columns
# (`doi, type, title, authors, publication_year, journal, publisher,
# keywords, volume, issue, first_page, last_page, referenced_works_count,
# cited_by_count`) plus the load-time-minted `id`. Baseline naming is
# uniformly descriptive (matches spec call "papers @ easy"). K8 only
# renames headers, so even rarely-populated columns cost nothing to
# author. dblp is the anchor source.

level_assignments:
  easy:
    dblp: descriptive
    crossref: descriptive
    open_alex: descriptive
  medium:
    dblp: abbreviated
    crossref: descriptive
    open_alex: cryptic
  hard:
    dblp: cryptic
    crossref: abbreviated
    open_alex: anonymized

# Ground-truth schema mapping: source_col -> target_col.
# Data is already canonical, so every mapping is identity (src_col == target_col).
# Canonical target names match input/schemamatching/target_schema.json and the
# K10 sign-off attribute_mapping. `id` is included (load-time-minted record id).
# `doi` is included here as a real schema column -- K8 only renames the HEADER;
# value knobs still never perturb doi (it is the fusion-gold join key).
sm_mapping:
  dblp:
    id: id
    doi: doi
    type: type
    title: title
    authors: authors
    publication_year: publication_year
    journal: journal
    publisher: publisher
    keywords: keywords
    volume: volume
    issue: issue
    first_page: first_page
    last_page: last_page
    referenced_works_count: referenced_works_count
    cited_by_count: cited_by_count
  crossref:
    id: id
    doi: doi
    type: type
    title: title
    authors: authors
    publication_year: publication_year
    journal: journal
    publisher: publisher
    keywords: keywords
    volume: volume
    issue: issue
    first_page: first_page
    last_page: last_page
    referenced_works_count: referenced_works_count
    cited_by_count: cited_by_count
  open_alex:
    id: id
    doi: doi
    type: type
    title: title
    authors: authors
    publication_year: publication_year
    journal: journal
    publisher: publisher
    keywords: keywords
    volume: volume
    issue: issue
    first_page: first_page
    last_page: last_page
    referenced_works_count: referenced_works_count
    cited_by_count: cited_by_count

