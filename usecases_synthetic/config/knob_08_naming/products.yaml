# Knob 08 — Schema Naming Divergence: Products
#
# All four products sources share the same schema, so K8 has limited
# ground to perturb. Hard rung is anonymized for products_4; medium /
# hard cycles through the abbreviated/cryptic ladder for the others.

level_assignments:
  easy:
    products_1: descriptive
    products_2: descriptive
    products_3: descriptive
    products_4: descriptive
  medium:
    products_1: descriptive
    products_2: abbreviated
    products_3: cryptic
    products_4: abbreviated
  hard:
    products_1: abbreviated
    products_2: cryptic
    products_3: anonymized
    products_4: cryptic

sm_mapping:
  products_1: &products_sm_mapping
    id: id
    title: title
    brand: brand
    description: description
    price: price
    priceCurrency: priceCurrency
    title_description: title_description
    product_type: product_type
    model: model
    model_number: model_number
    chipset_name: chipset_name
    vram_gb: vram_gb
    storage_gb: storage_gb
    bus_type: bus_type
    interface_type: interface_type
    memory_type: memory_type
    storage_connection_type: storage_connection_type
    form_factor: form_factor
    read_speed_mb_s: read_speed_mb_s
    write_speed_mb_s: write_speed_mb_s
  products_2: *products_sm_mapping
  products_3: *products_sm_mapping
  products_4: *products_sm_mapping

# Common rename ladder reused per source (all 4 products sources share
# the identical schema). Anonymized rung uses Attribute_<n> per the
# canonical K8 convention; cryptic uses short tokens that share roots
# across sources but break exact matching.
rename_table:
  products_1: &products_rename_table
    title:
      descriptive: title
      abbreviated: prd_ttl
      cryptic: t
      anonymized: Attribute_2
    brand:
      descriptive: brand
      abbreviated: brnd
      cryptic: br
      anonymized: Attribute_3
    description:
      descriptive: description
      abbreviated: desc
      cryptic: dsc
      anonymized: Attribute_4
    price:
      descriptive: price
      abbreviated: prc
      cryptic: amt
      anonymized: Attribute_5
    priceCurrency:
      descriptive: priceCurrency
      abbreviated: cur
      cryptic: ccy
      anonymized: Attribute_6
    title_description:
      descriptive: title_description
      abbreviated: t_desc
      cryptic: tdsc
      anonymized: Attribute_7
    product_type:
      descriptive: product_type
      abbreviated: prd_typ
      cryptic: ptyp
      anonymized: Attribute_8
    model:
      descriptive: model
      abbreviated: mdl
      cryptic: m
      anonymized: Attribute_9
    model_number:
      descriptive: model_number
      abbreviated: mdl_no
      cryptic: mno
      anonymized: Attribute_10
    chipset_name:
      descriptive: chipset_name
      abbreviated: chip
      cryptic: cn
      anonymized: Attribute_11
    vram_gb:
      descriptive: vram_gb
      abbreviated: vram
      cryptic: vrm
      anonymized: Attribute_12
    storage_gb:
      descriptive: storage_gb
      abbreviated: stor
      cryptic: stg
      anonymized: Attribute_13
    bus_type:
      descriptive: bus_type
      abbreviated: bus_t
      cryptic: bt
      anonymized: Attribute_14
    interface_type:
      descriptive: interface_type
      abbreviated: iface_t
      cryptic: it
      anonymized: Attribute_15
    memory_type:
      descriptive: memory_type
      abbreviated: mem_t
      cryptic: mt
      anonymized: Attribute_16
    storage_connection_type:
      descriptive: storage_connection_type
      abbreviated: stor_conn
      cryptic: sc
      anonymized: Attribute_17
    form_factor:
      descriptive: form_factor
      abbreviated: form_f
      cryptic: ff
      anonymized: Attribute_18
    read_speed_mb_s:
      descriptive: read_speed_mb_s
      abbreviated: rd_speed_mbs
      cryptic: rs
      anonymized: Attribute_19
    write_speed_mb_s:
      descriptive: write_speed_mb_s
      abbreviated: wr_speed_mbs
      cryptic: ws
      anonymized: Attribute_20
  products_2: *products_rename_table
  products_3: *products_rename_table
  products_4: *products_rename_table
