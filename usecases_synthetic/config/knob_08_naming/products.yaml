# Knob 08 — Schema Naming Divergence: Products
#
# All four products sources share the same schema, so K8 has limited
# ground to perturb. Hard rung is anonymized for products_4; medium /
# hard cycles through the abbreviated/cryptic ladder for the others.

level_assignments:
  easy:
    products_1: descriptive
    products_2: descriptive
    products_3: descriptive
    products_4: descriptive
  medium:
    products_1: descriptive
    products_2: abbreviated
    products_3: cryptic
    products_4: abbreviated
  hard:
    products_1: abbreviated
    products_2: cryptic
    products_3: anonymized
    products_4: cryptic

