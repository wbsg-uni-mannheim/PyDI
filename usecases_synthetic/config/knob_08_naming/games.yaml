# Knob 08 — Schema Naming Divergence: Games
#
# Rename tables per source per column at each rung on the
# descriptive -> abbreviated -> cryptic -> anonymized ladder.
#
# Refreshed against the 2026-05-04 CSV sources (post-loader column
# names). Per-domain note: refreshed metacritic shifted toward
# descriptive at baseline (`game_title, year_published, made_by,
# console, age_rating, ...`) — informational, level_assignments
# carry the difficulty curve.
#
# medium-rung tightening: sales drops from `cryptic` -> `abbreviated`
# (sales is abbreviated at baseline, so medium becomes identity-like
# for sales; the easy->medium delta now lives mostly in dbpedia +
# canonical-target rename-up via the SM oracle).

level_assignments:
  easy:
    dbpedia: descriptive
    metacritic: descriptive
    sales: descriptive
  medium:
    dbpedia: abbreviated
    metacritic: descriptive
    sales: abbreviated
  hard:
    dbpedia: cryptic
    metacritic: abbreviated
    sales: anonymized

# Ground-truth schema mapping: source_col -> target_col.
# Canonical target names follow the K10 sign-off attribute_mapping.
sm_mapping:
  dbpedia:
    id: id
    title: name
    launch_yr: releaseYear
    studio: developer
    system: platform
    genre: genres
    franchise: series
  metacritic:
    id: id
    game_title: name
    year_published: releaseYear
    made_by: developer
    console: platform
    genres: genres
    press_rating: criticScore
    player_rating: userScore
    age_rating: ESRB
  sales:
