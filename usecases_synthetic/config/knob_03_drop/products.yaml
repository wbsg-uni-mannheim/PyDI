# Knob 03 — Per-source Attribute Drop Rate — Products

domain: products

id_columns:
  products_1: id
  products_2: id
  products_3: id
  products_4: id

attribute_classes:
  products_1: &products_attr_classes
    title: primary
    brand: key
    description: secondary
    price: secondary
    priceCurrency: secondary
    title_description: secondary
    product_type: key
    model: secondary
    model_number: secondary
    chipset_name: secondary
    vram_gb: secondary
    storage_gb: secondary
    bus_type: secondary
    interface_type: secondary
    memory_type: secondary
    storage_connection_type: secondary
    form_factor: secondary
    read_speed_mb_s: secondary
    write_speed_mb_s: secondary
  products_2: *products_attr_classes
  products_3: *products_attr_classes
  products_4: *products_attr_classes

attribute_mapping:
  products_1: &products_attr_mapping
    title: title
    brand: brand
    description: description
    price: price
    priceCurrency: priceCurrency
    title_description: title_description
    product_type: product_type
    model: model
    model_number: model_number
    chipset_name: chipset_name
    vram_gb: vram_gb
    storage_gb: storage_gb
    bus_type: bus_type
    interface_type: interface_type
    memory_type: memory_type
    storage_connection_type: storage_connection_type
    form_factor: form_factor
    read_speed_mb_s: read_speed_mb_s
    write_speed_mb_s: write_speed_mb_s
  products_2: *products_attr_mapping
  products_3: *products_attr_mapping
  products_4: *products_attr_mapping

rates_per_level:
  easy:
    primary: 0.0
    key: 0.02
    secondary: 0.05
  medium:
    primary: 0.0
    key: 0.10
    secondary: 0.15
  hard:
    primary: 0.03
    key: 0.25
    secondary: 0.35

transform_per_level:
  easy: compress
  medium: identity
  hard: stretch

compression_factor: 0.7
stretch_factor: 1.5

single_source_survivor_cap_hard: 0.05
per_cell_ceiling_delta: 0.10

# Products R1 + cross-knob extension columns: tighten K3 ceiling for already-sparse
# attributes so stretch never demands negative headroom. Mirrors companies dbpedia
# financials + games dbpedia.franchise pattern.
per_source_attribute_overrides:
  products_1: &products_attr_caps
    chipset_name: 0.02         # 72% missing
    vram_gb: 0.02              # 72% missing
    memory_type: 0.02          # 74% missing
    read_speed_mb_s: 0.02      # 82% missing
    write_speed_mb_s: 0.02     # 85% missing
    model_number: 0.05         # 60% missing
    storage_gb: 0.05           # 30% missing
    interface_type: 0.05       # 48% missing
    storage_connection_type: 0.05  # 50% missing
    form_factor: 0.05          # 50% missing
    # bus_type: ~25% missing → default 0.10 ceiling (no override)
  products_2: *products_attr_caps
  products_3: *products_attr_caps
  products_4: *products_attr_caps
