# Knob 01 - Surface Augmentation Intensity - Games
#
# Authored per knobs/knob_01_surface_augmentation.md.
#
# Refreshed 2026-05-07 against the post-2026-05-04 CSV sources at
# usecases/games/input/data/{dbpedia,metacritic,sales}.csv.
# Column-name remap from pre-refresh schema:
#   dbpedia:    gameLabel -> title, platform -> system,
#               developer -> studio, releaseDate -> launch_yr (numeric)
#   metacritic: name -> game_title, release_date -> year_published,
#               developer -> made_by, platform -> console,
#               rating -> age_rating
#   sales:      Title -> prod_title, Year_of_Release -> launch_dt,
#               Developer -> studio, Publisher -> dist,
#               Platform -> hw, Genre -> genre,
#               Rating -> age_classification
#
# Baseline easy -> medium for short fields. ESRB / system / franchise
# vocabularies already shared at baseline -> easy near-passthrough;
# medium and hard need active per-source paraphrasing.

domain: games

# ID columns: loader renames source-native ids (dbpedia.wiki_ref /
# metacritic.mc_id / sales.rec_id) to `id`.
id_columns:
  dbpedia: id
  metacritic: id
  sales: id

# Per-source column -> attribute class.
# Columns NOT listed are never touched by Knob 01.
attribute_classes:
  dbpedia:
    title: primary
    system: key
    genre: categorical
    studio: secondary
    franchise: secondary
  metacritic:
    game_title: primary
    console: key
    age_rating: key
    genres: categorical
    made_by: secondary
  sales:
    prod_title: primary
    hw: key
    age_classification: key
    genre: categorical
    studio: secondary
    dist: secondary

# Source column -> canonical target attribute.
attribute_mapping:
  dbpedia:
    title: name
    system: platform
    genre: genres
    studio: developer
    franchise: series
  metacritic:
    game_title: name
    console: platform
    age_rating: ESRB
    genres: genres
    made_by: developer
  sales:
    prod_title: name
    hw: platform
    age_classification: ESRB
    genre: genres
    studio: developer
    dist: publisher

# Per-attribute-class paraphrase rates per level (monotone increasing).
paraphrase_rate_primary:
  easy: 0.0
  medium: 0.04
  hard: 0.12
paraphrase_rate_key:
  easy: 0.0
  medium: 0.08
  hard: 0.18
paraphrase_rate_secondary:
  easy: 0.0
  medium: 0.16
  hard: 0.30
paraphrase_rate_categorical:
  easy: 0.0
  medium: 0.08
  hard: 0.18

operator_mix:
  easy:
    # Note: dormant under `paraphrase_rate_*.easy: 0.0` (the rate-based
    # dispatcher short-circuits before reaching operator sampling at easy).
    # The easy normalize-down work runs via `baseline_above_target_rules`
    # at a separate code path. Kept as defensive placeholder for any future
    # easy-rate bump.
    normalize_to_canonical: 1.0
  medium:
    abbreviate: 2.0
    eda_random_swap: 1.0
    eda_random_delete: 1.0
    llm_paraphrase: 1.0
  hard:
    abbreviate: 1.5
    eda_random_swap: 1.0
    eda_random_delete: 1.0
    llm_paraphrase: 3.0

# Easy-only normalize-down: harmonise platform abbreviations to a
# canonical sibling form. dbpedia `system` carries the long form
# (e.g. "PlayStation Vita"); sales `hw` and metacritic `console` use
# the short codes (e.g. "PS3", "Vita"). Easy projects to the shorter
# sibling.
baseline_above_target_rules:
  - source: dbpedia
    attribute: system
    canonical_from: sales
    canonical_attribute: hw
    strategy: shortest

# Games abbreviation table: platforms, ESRB, common publishers/devs.
# ~40 entries total per the 2026-05-07 K1 sign-off.
abbreviation_table:
  # PlayStation family
  "PlayStation": "PS"
  "PlayStation 2": "PS2"
  "PlayStation 3": "PS3"
  "PlayStation 4": "PS4"
  "PlayStation 5": "PS5"
  "PlayStation Portable": "PSP"
  "PlayStation Vita": "Vita"
  # Nintendo family
  "Nintendo Entertainment System": "NES"
  "Super Nintendo Entertainment System": "SNES"
  "Nintendo Switch": "Switch"
  "Game Boy Color": "GBC"
  "Game Boy Advance": "GBA"
  "Nintendo DS": "DS"
  "Nintendo 3DS": "3DS"
  "Wii U": "WiiU"
  # Xbox family
  "Xbox One": "XB1"
  "Xbox Series X": "XSX"
  "Xbox 360": "X360"
  # Other platforms
  "Personal Computer": "PC"
  "Microsoft Windows": "PC"
  "Sega Mega Drive": "Genesis"
  "Atari 2600": "2600"
  # ESRB ratings (also lives in categorical_vocab_map)
  "Everyone": "E"
  "Everyone 10+": "E10+"
  "Teen": "T"
  "Mature 17+": "M"
  "Adults Only": "AO"
  "Rating Pending": "RP"
  # Publishers / developers
  "Electronic Arts": "EA"
  "Activision": "ATVI"
  "Ubisoft": "UBI"
  "Take-Two Interactive": "TTWO"
  "Sony Computer Entertainment": "SCE"
  "Square Enix": "SE"
  "Bethesda Softworks": "Bethesda"
  "Konami Digital Entertainment": "Konami"

# Categorical vocab map (genre + ESRB synonyms). Bidirectional.
categorical_vocab_map:
  # ESRB
  "Everyone": "E"
  "Everyone 10+": "E10+"
  "Teen": "T"
  "Mature 17+": "M"
  "Adults Only": "AO"
  # Genre
  "First-Person Shooter": "FPS"
  "Third-Person Shooter": "TPS"
  "Role-Playing Game": "RPG"
  "Massively Multiplayer Online": "MMO"
  "Real-Time Strategy": "RTS"
  "Action Role-Playing Game": "ARPG"
  "Multiplayer Online Battle Arena": "MOBA"

stopword_list:
  - the
  - a
  - an
  - of
  - and
  - "video game"

key_token_skiplist:
  dbpedia:
    title: []
  metacritic:
    game_title: []
  sales:
    prod_title: []

key_token_skiplist_global: []

# Hard-path LLM config. Default gpt-5.4-mini per the 2026-05-06
# LLM-model-default policy; ask user before each K1 hard run whether
# to bump to gpt-5.4.
# R10-D 2026-05-29: prompt_version bumped to v2 -- minimum-divergence
# rule, <UNCHANGED> sentinel escape, per-attribute-class prompt
# split (primary/key -> short_v2, secondary -> secondary_v2,
# categorical -> categorical_v2). Cache key under
# cache/knob_01_paraphrases/<domain>/<level>/ rotates on this bump.
llm_prompt_version: v2
llm_model_id: gpt-5.4-mini
llm_temperature: 0.0

anchor_survivor_floor:
  primary: true
  key: false
  secondary: false
  categorical: false
